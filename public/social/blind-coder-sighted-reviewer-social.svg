<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Case File: The Blind Coder and the Sighted Reviewer - Vanden IT">
  <defs>
    <radialGradient id="bgGlow2" cx="30%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#2f9fff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2f9fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#050a0f"/>
  <rect width="1200" height="630" fill="url(#bgGlow2)"/>

  <!-- Cobalt case-file rule -->
  <rect x="80" y="100" width="3" height="52" fill="#2f9fff"/>

  <!-- Case file kicker -->
  <text x="100" y="128" fill="#66b9ff" font-family="ui-monospace, monospace" font-size="16" letter-spacing="3">CASE FILE / AI DELIVERY WORKFLOW</text>

  <!-- Headline -->
  <text x="80" y="250" fill="#f3ebdc" font-family="'Arial Narrow', sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5">
    <tspan x="80" dy="0">The Blind Coder and</tspan>
    <tspan x="80" dy="70">the Sighted Reviewer</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="400" fill="#aeb9c3" font-family="sans-serif" font-size="22">Two AIs with opposite capabilities. One session. 29 files changed.</text>

  <!-- Mini workflow rail: cobalt steps to amber human decision -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="3" height="44" fill="#2f9fff"/>
    <text x="12" y="18" fill="#66b9ff" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">HERMES - CLAUDE - FEEDBACK - FIX</text>
    <text x="12" y="38" fill="#f0a84a" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">- FILIP DECIDES WHAT SHIPS</text>
  </g>

  <!-- Identifier mark bottom-right -->
  <rect x="990" y="540" width="2" height="40" fill="#d98b32" opacity="0.5"/>
  <text x="1000" y="560" fill="#7f8d99" font-family="ui-monospace, monospace" font-size="14" letter-spacing="1">vandenit.be</text>
</svg>