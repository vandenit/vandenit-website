<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Vanden IT — Senior Developer and Fractional Tech Lead">
  <defs>
    <radialGradient id="bgGlow" cx="25%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#2f9fff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2f9fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#050a0f"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Cobalt rule -->
  <rect x="80" y="120" width="3" height="60" fill="#2f9fff"/>

  <!-- Kicker -->
  <text x="100" y="145" fill="#66b9ff" font-family="ui-monospace, monospace" font-size="16" letter-spacing="3">VANDEN IT - ANTWERP</text>

  <!-- Headline -->
  <text x="80" y="280" fill="#f3ebdc" font-family="'Arial Narrow', sans-serif" font-size="72" font-weight="700" letter-spacing="-2">
    <tspan x="80" dy="0">Senior Developer</tspan>
    <tspan x="80" dy="78">and Fractional Tech Lead</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="430" fill="#aeb9c3" font-family="sans-serif" font-size="24">AI-augmented delivery with human judgement at every step.</text>

  <!-- Amber decision cue -->
  <rect x="80" y="470" width="3" height="24" fill="#d98b32"/>
  <text x="100" y="488" fill="#f0a84a" font-family="ui-monospace, monospace" font-size="15" letter-spacing="2">HUMAN-OWNED - SYSTEM-AUGMENTED</text>

  <!-- Identifier mark bottom-right -->
  <rect x="990" y="540" width="2" height="40" fill="#2f9fff" opacity="0.5"/>
  <text x="1000" y="560" fill="#7f8d99" font-family="ui-monospace, monospace" font-size="14" letter-spacing="1">vandenit.be</text>
</svg>