<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">AI analysis converges at a human decision</title>
  <desc id="desc">Three blue analysis paths converge at an amber human checkpoint before continuing to production.</desc>
  <g stroke="var(--vdit-color-line, #243746)" stroke-opacity=".7">
    <path d="M40 40H1160M40 380H1160"/>
    <path d="M120 20V400M1080 20V400" stroke-dasharray="2 10"/>
  </g>
  <g stroke="var(--vdit-color-system, #2F9FFF)" stroke-width="2" vector-effect="non-scaling-stroke">
    <path d="M120 210C230 210 220 90 360 90H650C760 90 760 210 870 210"/>
    <path d="M120 210H870"/>
    <path d="M120 210C230 210 220 330 360 330H650C760 330 760 210 870 210"/>
  </g>
  <g fill="var(--vdit-color-system, #2F9FFF)">
    <circle cx="250" cy="130" r="4"/><circle cx="420" cy="90" r="4"/><circle cx="610" cy="90" r="4"/>
    <circle cx="290" cy="210" r="4"/><circle cx="500" cy="210" r="4"/><circle cx="690" cy="210" r="4"/>
    <circle cx="250" cy="290" r="4"/><circle cx="420" cy="330" r="4"/><circle cx="610" cy="330" r="4"/>
  </g>
  <g stroke="var(--vdit-color-risk, #EF6262)" stroke-width="2" vector-effect="non-scaling-stroke">
    <path d="M700 56L716 84H684L700 56Z"/><path d="M700 65V74M700 78V80"/>
  </g>
  <g stroke="var(--vdit-color-human, #D98B32)" stroke-width="2" vector-effect="non-scaling-stroke">
    <circle cx="900" cy="210" r="48"/><circle cx="900" cy="210" r="30"/><circle cx="900" cy="210" r="10" fill="var(--vdit-color-human, #D98B32)"/>
    <path d="M948 210H1080"/>
  </g>
  <circle cx="1100" cy="210" r="15" stroke="var(--vdit-color-text, #F3EBDC)" stroke-width="2"/>
  <circle cx="1100" cy="210" r="3" fill="var(--vdit-color-text, #F3EBDC)"/>
</svg>

